# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request pushes are worth cancelling. Cancelling on main is not: it can
  # leave a merged commit with no green run of its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One job. `make ci` already cross-compiles both architectures and asserts they are static, so
  # a second job would repeat that work on a second runner and add nothing. The next person will
  # want to unify two things it deliberately keeps apart: `make test` and `make cover` run with
  # CGO_ENABLED=1 because the race detector needs cgo, and `make static-check` builds with
  # CGO_ENABLED=0 because the shipped binary must be static. Getting that backwards produces
  # either an unraced suite or a dynamically linked release binary.
  #
  # timeout-minutes is the ten-minute budget of PLAN.md section 11, enforced rather than hoped
  # for. `make ci` prints the per-target wall clock and appends it to the run summary, so a
  # target on its way to the limit is visible before it hits it.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 gives `make cover-ratchet-check` a merge base with origin/main to compare
      # coverage.floors against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - run: make ci-core
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: messq-binaries
          path: dist/messq-linux-*
          if-no-files-found: error

  # The gates self-test in its own job, per PLAN.md section 11: a gate that outgrew the
  # ten-minute lane budget is sharded, never weakened. Each row of the matrix runs a full
  # make cover/test/lint in its own scratch copy of the tree, so with the store/api/cli
  # suites grown it needs more wall clock than the ci job's ten-minute budget allows.
  # Unlike fuzz it IS a required check: a gate nobody has seen fail is a gate nobody knows
  # works, and every row here is deterministic (no fuzz-style coordinator flake).
  gates:
    runs-on: ubuntu-latest
    # Rows are intentionally serial: each row is already a full make target and may consume the
    # runner's CPUs internally. Thirty minutes leaves the 20-minute per-row hang bound meaningful
    # and gives the serial matrix room to finish without reintroducing nested fan-out.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Gates self-test (serial row scheduling)
        env:
          GATES_PARALLEL: "1"
        run: make gates-selftest

  # Issue #18's wire-contract lane: shape digests, the ADDITIVE/BREAKING classifier and
  # the closed-code enum source. Its own job rather than a step of `ci` for the same
  # reason fuzz is: the contract/docs suites this grows into need a budget of their own,
  # and sharding now keeps that move additive instead of a mid-milestone reshuffle.
  # Unlike fuzz this IS a required check: branch protection lists the `wirecheck` context
  # alongside ci+gates (review must-fix on PR #71) — a wire-contract lane nobody waits
  # for is documentation theatre, not a gate.
  wirecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - run: make wirecheck

  # The main-push crash lane: 100 kill/restart cycles in both durability modes against the
  # three-valued ledger oracle. It is deliberately NOT on the pull-request path — the 8-cycle
  # smoke already runs inside `make test` in the `ci` job — and its budget exceeds the ci job's
  # ten minutes, so it rides a runner of its own, gated to main.
  crash-kill9:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: SIGKILL sweep, both durability modes
        run: go test ./test/crash/ -run TestCrashKill9 -crash.cycles=100 -crash.durability=both -timeout 20m

  # A job of its own rather than a step in `make ci`. Four fuzz targets at sixty seconds each is
  # four minutes, which does not fit inside the ten-minute budget the ci job is held to; running
  # them on a second runner keeps both under their limits. Fuzzing is a generator, not a gate on
  # the diff: the committed seed corpus is what `make ci` replays, and this job is what grows it.
  #
  # DECISION (#3): this job is deliberately NOT in branch protection's required checks, and stays
  # out until #33 hardens the fuzz lane. `go test -fuzz` reports a bare `context deadline
  # exceeded` when its coordinator cannot collect a worker inside the shutdown deadline, which
  # reproduces under CPU contention and is indistinguishable by exit code from a real crasher. A
  # required check that goes red without a reproduction artifact blocks merges on runner load,
  # and a lane people learn to re-run on red is not a gate. The blocking regression net is
  # already the committed seed corpus, which `make test` and `make cover` replay inside the
  # required `ci` job on every push. Revisit when #33 lands: fold this into the required set once
  # the flake is either fixed or narrowly distinguished from a genuine failure.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - run: make fuzz
      # A crasher is written into the package's testdata/fuzz directory, which is exactly the
      # reproduction artifact CONTRIBUTING.md asks every fix to carry. Keeping it as an artifact
      # is what makes it recoverable after the runner is gone.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers
          path: internal/*/testdata/fuzz/**
          if-no-files-found: ignore
