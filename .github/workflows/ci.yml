# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request pushes are worth cancelling. Cancelling on main is not: it can
  # leave a merged commit with no green run of its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One job. `make ci` already cross-compiles both architectures and asserts they are static,
  # so a second job would repeat that work on a second runner and add nothing.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.mod
      - run: make ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: messq-binaries
          path: dist/messq-linux-*
          if-no-files-found: error
