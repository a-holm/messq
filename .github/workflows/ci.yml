# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request pushes are worth cancelling. Cancelling on main is not: it can
  # leave a merged commit with no green run of its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One job. `make ci` already cross-compiles both architectures and asserts they are static, so
  # a second job would repeat that work on a second runner and add nothing. The next person will
  # want to unify two things it deliberately keeps apart: `make test` and `make cover` run with
  # CGO_ENABLED=1 because the race detector needs cgo, and `make static-check` builds with
  # CGO_ENABLED=0 because the shipped binary must be static. Getting that backwards produces
  # either an unraced suite or a dynamically linked release binary.
  #
  # timeout-minutes is the ten-minute budget of PLAN.md section 11, enforced rather than hoped
  # for. `make ci` prints the per-target wall clock and appends it to the run summary, so a
  # target on its way to the limit is visible before it hits it.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 gives `make cover-ratchet-check` a merge base with origin/main to compare
      # coverage.floors against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.mod
      - run: make ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: messq-binaries
          path: dist/messq-linux-*
          if-no-files-found: error
